
# Backend API routes (/api/**) are handled by Cloudflare Pages
# Do not add /api rewrites to firebase.json
name: Deploy to Firebase Hosting (wataalamu-436e7)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Node version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          CI: false
          NODE_ENV: production

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build successful: $(ls dist | wc -l) files found"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Create Firebase config
        run: |
          echo '{"projects":{"default":"wataalamu-436e7"}}' > .firebaserc
          echo '{
            "hosting": {
              "site": "wataalamu-436e7",
              "public": "dist",
              "ignore": [
                "firebase.json",
                "**/.*",
                "**/node_modules/**",
                "**/*.log",
                "README.md",
                "package*.json"
              ],
              "rewrites": [
                {
                  "source": "**",
                  "destination": "/index.html"
                }
              ]
            }
          }' > firebase.json

      - name: Deploy to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json
          export GOOGLE_APPLICATION_CREDENTIALS=serviceAccount.json
          firebase deploy --only hosting:wataalamu-436e7 --project wataalamu-436e7 --non-interactive
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
